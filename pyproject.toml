[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-canary-system"
version = "0.1.0"
description = "Deterministic local canary planning and recorded-result gates"
requires-python = ">=3.10"

[project.scripts]
acs = "agent_canary_system.cli:main"

[tool.setuptools.packages.find]
include = ["agent_canary_system*"]
